- pipeline: "Deploy To Production"
  name: "Deploy To Production"
  events:
    - type: PUSH
      refs:
        - refs/heads/main
  terminate_stale_runs: true
  actions:
    - action: "Build Agent-Native app"
      type: "BUILD"
      docker_image_name: "node"
      docker_image_tag: "22"
      shell: "BASH"
      execute_commands:
        - "corepack enable"
        - "corepack prepare pnpm@12.4.1 --activate"
        - 'test -n "$DATABASE_URL" || { echo "ERROR: set DATABASE_URL as a Buddy project variable. Agent-Native needs persistent Postgres for production."; exit 1; }'
        - 'test -n "$BETTER_AUTH_SECRET" || { echo "ERROR: set BETTER_AUTH_SECRET as a Buddy project variable."; exit 1; }'
        - 'test -n "$APP_URL" || { echo "ERROR: set APP_URL=https://dashboard.gojolo.io as a Buddy project variable."; exit 1; }'
        - "pnpm install --frozen-lockfile"
        - "pnpm typecheck"
        - "pnpm build"
        - 'test -f .output/server/index.mjs && test -d .output/public || { echo "ERROR: expected .output/server/index.mjs and .output/public after build"; exit 1; }'

    - action: "Transfer build to production (SFTP)"
      type: "TRANSFER"
      input_type: "BUILD_ARTIFACTS"
      local_path: "/.output"
      remote_path: "$PROD_DEPLOY_PATH/.output"
      use_temporary_files: true
      deletion_disabled: false
      deployment_excludes:
        - ".DS_Store"
        - "*.map"
      targets:
        - target: "production-cloudpanel"
          type: "SSH"
          name: "CloudPanel Production"
          host: "$DOZER_HOST"
          port: "22"
          path: "$PROD_DEPLOY_PATH"
          auth:
            method: "ASSETS_KEY"
            username: "$PROD_SSH_USER"
            asset: "BROBOT_BA"

    - action: "Write runtime env and restart production"
      type: "SSH_COMMAND"
      shell: "BASH"
      run_as_script: true
      working_directory: "$PROD_DEPLOY_PATH"
      commands: |-
        set -euo pipefail
        cd "$PROD_DEPLOY_PATH"

        : "${DATABASE_URL:?DATABASE_URL Buddy variable is required}"
        : "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET Buddy variable is required}"
        : "${APP_URL:?APP_URL Buddy variable is required}"
        : "${PROD_SERVICE:?PROD_SERVICE Buddy variable is required}"
        PORT="${PROD_APP_PORT:-3005}"

        umask 077
        cat > .env <<ENV_EOF
        NODE_ENV=production
        PORT=${PORT}
        HOST=127.0.0.1
        NITRO_HOST=127.0.0.1
        NITRO_PORT=${PORT}
        APP_URL=${APP_URL}
        DATABASE_URL=${DATABASE_URL}
        BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
        VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
        ENV_EOF
        chmod 600 .env

        export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
        systemctl --user daemon-reload
        systemctl --user restart "$PROD_SERVICE"

        for i in $(seq 1 45); do
          if systemctl --user is-active --quiet "$PROD_SERVICE" \
             && curl -fsS -I --connect-timeout 2 --max-time 5 "http://127.0.0.1:${PORT}/" >/dev/null; then
            curl -fsS -I --connect-timeout 3 --max-time 10 "$APP_URL/" >/dev/null
            echo "Production health check passed after ${i}s"
            exit 0
          fi
          sleep 1
        done

        echo "Health check failed on port ${PORT}"
        systemctl --user status "$PROD_SERVICE" --no-pager || true
        journalctl --user -u "$PROD_SERVICE" -n 120 --no-pager || true
        exit 1
      targets:
        - target: "production-cloudpanel"
          type: "SSH"
          name: "CloudPanel Production"
          host: "$DOZER_HOST"
          port: "22"
          path: "$PROD_DEPLOY_PATH"
          auth:
            method: "ASSETS_KEY"
            username: "$PROD_SSH_USER"
            asset: "BROBOT_BA"
